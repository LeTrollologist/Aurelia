version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # These are workspace path dependencies, not crates.io releases. Dependabot
    # otherwise tries to resolve a registry version for them and fails the job.
    ignore:
      - dependency-name: "aurelia-core"
      - dependency-name: "aurelia-render"
      - dependency-name: "aurelia-io"
      - dependency-name: "aurelia-ui"
      - dependency-name: "aurelia-presence"
      - dependency-name: "aurelia-app"
      # Dependabot's Cargo lockfile validator aborts on these patch updates in this
      # workspace; they are reviewed and pinned manually instead of failing every job.
      - dependency-name: "log"
      - dependency-name: "flate2"
      # Cargo lockfile validation currently aborts on several 0.x major jumps
      # (rfd/egui/glam/thiserror are the observed ones). Take those manually.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "pip"
    directory: "/tools/release"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
