version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # These are workspace path dependencies, not crates.io releases. Dependabot
    # otherwise tries to resolve a registry version for them and fails the job.
    ignore:
      - dependency-name: "aurelia-core"
      - dependency-name: "aurelia-render"
      - dependency-name: "aurelia-io"
      - dependency-name: "aurelia-ui"
      - dependency-name: "aurelia-presence"
      - dependency-name: "aurelia-app"

  - package-ecosystem: "pip"
    directory: "/tools/release"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
